name: Playwright Tests
on:
  push:
    branches: [ prod, feat/ci-cd ]
  pull_request:
    branches: [ prod ]
  workflow_dispatch:
jobs:
  test:
    if: github.ref == 'refs/heads/prod'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run functional tests
      run: npx playwright test tests/home.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: devcon/test-results/
        retention-days: 30

  visual-regression:
    if: github.ref == 'refs/heads/prod'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run visual regression tests (update baselines)
      run: npx playwright test tests/visual.spec.ts --update-snapshots
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-results
        path: devcon/test-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: linux-baselines
        path: devcon/tests/visual.spec.ts-snapshots/
        retention-days: 30

  deploy:
    needs: [test, lighthouse]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    - uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-version: 'latest'

  lighthouse:
    if: github.ref == 'refs/heads/prod'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Start server
      run: npm run start &
    - name: Wait for server
      run: until curl -s http://localhost:3000 > /dev/null; do sleep 2; done
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v12
      with:
        urls: |
          http://localhost:3000
        configPath: lighthouserc.json
        uploadArtifacts: true