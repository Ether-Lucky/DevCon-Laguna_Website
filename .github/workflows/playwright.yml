name: Playwright Tests
on:
  push:
    branches: [ prod, feat/ci-cd ]
  pull_request:
    branches: [ prod ]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate and commit the Linux visual baselines'
        type: boolean
        default: false
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npm run lint

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run functional and regression tests
      # Every spec except the visual suite, which has its own job below.
      # Discovered rather than listed so new spec files are picked up automatically.
      run: npx playwright test $(ls tests/*.spec.ts | grep -v 'visual.spec.ts')
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: devcon/test-results/
        retention-days: 30

  visual-regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: []
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Default runs COMPARE against the committed Linux baselines. Using
    # --update-snapshots here would rewrite the baseline on every run, so the
    # job could never fail and could never detect a regression.
    - name: Compare against baselines
      if: github.event.inputs.update_visual_baselines != 'true'
      run: npx playwright test tests/visual.spec.ts

    # Deliberate, manually triggered refresh: run the workflow from the Actions
    # tab with "Regenerate and commit the Linux visual baselines" checked.
    - name: Regenerate baselines
      if: github.event.inputs.update_visual_baselines == 'true'
      run: npx playwright test tests/visual.spec.ts --update-snapshots

    - name: Commit refreshed baselines
      if: github.event.inputs.update_visual_baselines == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tests/visual.spec.ts-snapshots
        if git diff --cached --quiet; then
          echo "Baselines already up to date; nothing to commit."
        else
          git commit -m "chore(visual): refresh Linux baselines [skip ci]"
          git push
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-results
        path: devcon/test-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: linux-baselines
        path: devcon/tests/visual.spec.ts-snapshots/
        retention-days: 30

  deploy:
    needs: [lint, test, lighthouse]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    - uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-version: 'latest'
        # Without --prod this publishes a PREVIEW deployment, which gets a
        # throwaway URL and never updates the production alias. The job still
        # reports success, so prod silently stayed on an old build.
        vercel-args: '--prod'

  lighthouse:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Start server
      run: npm run start &
    - name: Wait for server
      run: until curl -s http://localhost:3000 > /dev/null; do sleep 2; done
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v12
      with:
        urls: |
          http://localhost:3000
        configPath: lighthouserc.json
        uploadArtifacts: true