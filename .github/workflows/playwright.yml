name: Playwright Tests
on:
  push:
    branches: [ prod, feat/ci-cd ]
  pull_request:
    branches: [ prod ]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate and commit the Linux visual baselines'
        type: boolean
        default: false
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npm run lint

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run functional and regression tests
      # Every spec except the visual suite, which has its own job below.
      # Discovered rather than listed so new spec files are picked up automatically.
      #
      # --fail-on-flaky-tests: a test that fails and then passes on retry FAILS
      # the job (CICD-BT-06). Retries still run, so a genuine blip is visible in
      # the report rather than silently rescuing the build. Three flaky tests
      # had been hidden this way; a real regression and a timing glitch look
      # identical once a retry turns them into a pass.
      run: npx playwright test --fail-on-flaky-tests $(ls tests/*.spec.ts | grep -v 'visual.spec.ts')
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: devcon/test-results/
        retention-days: 30

  visual-regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: []
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Default runs COMPARE against the committed Linux baselines. Using
    # --update-snapshots here would rewrite the baseline on every run, so the
    # job could never fail and could never detect a regression.
    - name: Compare against baselines
      if: github.event.inputs.update_visual_baselines != 'true'
      # See the note on --fail-on-flaky-tests in the test job above.
      run: npx playwright test --fail-on-flaky-tests tests/visual.spec.ts

    # Deliberate, manually triggered refresh: run the workflow from the Actions
    # tab with "Regenerate and commit the Linux visual baselines" checked.
    - name: Regenerate baselines
      if: github.event.inputs.update_visual_baselines == 'true'
      run: npx playwright test tests/visual.spec.ts --update-snapshots

    - name: Commit refreshed baselines
      if: github.event.inputs.update_visual_baselines == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tests/visual.spec.ts-snapshots
        if git diff --cached --quiet; then
          echo "Baselines already up to date; nothing to commit."
        else
          git commit -m "chore(visual): refresh Linux baselines [skip ci]"
          git push
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-report
        path: devcon/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-results
        path: devcon/test-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: linux-baselines
        path: devcon/tests/visual.spec.ts-snapshots/
        retention-days: 30


  lighthouse:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devcon
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Start server
      run: npm run start &
    - name: Wait for server
      run: until curl -s http://localhost:3000 > /dev/null; do sleep 2; done
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v12
      with:
        urls: |
          http://localhost:3000
        configPath: lighthouserc.json
        uploadArtifacts: true